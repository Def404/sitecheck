# Конфигурация golangci-lint для sitecheck
# Docs: https://golangci-lint.run/usage/configuration/

run:
  timeout: 5m
  go: "1.24"

# Пропускаем артефакты и каталоги с бинарниками
issues:
  exclude-dirs:
    - dist
  exclude-files:
    - ".*_test.go$"

linters:
  disable-all: true
  enable:
    # базовые (включены по умолчанию, но перечисляем явно)
    - govet
    - errcheck
    - staticcheck
    - unused
    - gosimple
    # формат / стиль
    - gofmt
    - goimports
    # надёжность
    - gosec
    - revive
    - misspell
    # производительность / упрощение
    - unconvert
    - unparam
    - prealloc
    - ineffassign

linters-settings:
  goimports:
    local-prefixes: sitecheck

  gosec:
    # CGO и exec.Command используются осознанно (ping, powershell, scutil)
    excludes:
      - G104 # error return not checked — используем errors.Join в большинстве мест
      - G204 # audit use of subprocess launching — exec.Command для системных утилит
      - G304 # file path provided as taint input — пути из CLI-аргументов

  revive:
    rules:
      - name: package-comments
      - name: exported
        arguments:
          - "checkPrivateReceivers"
      - name: unexported-return
      - name: unused-parameter
      - name: indent-error-flow

  misspell:
    locale: US
    ignore-words: []
