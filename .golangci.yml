# Конфигурация golangci-lint v2 для sitecheck
# Docs: https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 5m
  exclude-dirs:
    - dist

formatters:
  enable:
    - gofmt
    - goimports

linters:
  default: standard
  enable:
    # надёжность
    - gosec
    - revive
    - misspell
    # производительность / упрощение
    - unconvert
    - unparam
    - prealloc
    - ineffassign
  settings:
    goimports:
      local-prefixes: sitecheck

    gosec:
      # CGO и exec.Command используются осознанно (ping, powershell, scutil)
      excludes:
        - G104 # error return not checked — используем errors.Join в большинстве мест
        - G204 # audit use of subprocess launching — exec.Command для системных утилит
        - G304 # file path provided as taint input — пути из CLI-аргументов

    revive:
      rules:
        - name: package-comments
        - name: exported
          arguments:
            - "checkPrivateReceivers"
        - name: unexported-return
        - name: unused-parameter
        - name: indent-error-flow

    misspell:
      locale: US
      ignore-words: []
