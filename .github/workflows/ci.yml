name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: '1.24.4'
  PKG: ./sitecheck  # main-пакет; go.mod лежит в корне

jobs:
  # ---------------------------------------------------------------------
  # 1. Базовая проверка: fmt, vet, lint, тесты (с -race), build
  # ---------------------------------------------------------------------
  check:
    name: Check (fmt / vet / lint / test / build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.mod

      - name: go mod tidy (verify)
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "::error::go.mod / go.sum are not tidy. Run 'make tidy'."
            git diff -- go.mod go.sum
            exit 1
          fi

      - name: gofmt check
        run: |
          bad=$(gofmt -l sitecheck)
          if [ -n "$bad" ]; then
            echo "::error::gofmt: files need formatting:"
            echo "$bad"
            exit 1
          fi

      - name: go vet
        run: go vet ${{ env.PKG }}/...

      - name: Test (with race detector)
        run: go test -race -count=1 -v ${{ env.PKG }}/...

      - name: Build (local, verify ldflags)
        working-directory: ${{ github.workspace }}
        run: |
          make build
          ./dist/sitecheck --version

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: 2.15.0
          args: --config=.golangci.yml ${{ env.PKG }}/...

  # ---------------------------------------------------------------------
  # 2. Кросс-компиляция + артефакты
  # ---------------------------------------------------------------------
  cross-compile:
    name: Cross-compile (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.mod

      - name: Version info
        run: |
          VERSION="${GITHUB_REF_NAME}"
          case "$GITHUB_REF" in
            refs/tags/*) : ;;
            *) VERSION="dev" ;;
          esac
          COMMIT="${GITHUB_SHA:0:7}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "COMMIT=$COMMIT" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$DATE" >> "$GITHUB_ENV"

      - name: Build
        run: |
          out="sitecheck-${{ matrix.goos }}-${{ matrix.goarch }}"
          [ "${{ matrix.goos }}" = "windows" ] && out="$out.exe"
          mkdir -p dist
          make build VERSION="$VERSION" COMMIT="$COMMIT" \
            BINARY_OUT="dist/$out" 2>/dev/null || \
          go build -trimpath \
            -ldflags "-s -w -X main.version=$VERSION -X main.commit=$COMMIT -X main.buildDate=$BUILD_DATE" \
            -o "dist/$out" $PKG

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sitecheck-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/sitecheck-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}
          retention-days: 14

  # ---------------------------------------------------------------------
  # 3. Release (только для тегов v*)
  # ---------------------------------------------------------------------
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: cross-compile
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.mod

      - name: Build
        run: |
          out="sitecheck-${{ matrix.goos }}-${{ matrix.goarch }}"
          [ "${{ matrix.goos }}" = "windows" ] && out="$out.exe"
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X main.version=${{ github.ref_name }} -X main.commit=${{ github.sha }} -X main.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "dist/$out" $PKG

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/sitecheck-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
